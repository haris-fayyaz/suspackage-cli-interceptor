extract:
  zip_password: infected      # public password of the DataDog dataset
  max_files: 5000             # max archive entries scanned per package
  max_py_bytes: 1000000       # skip single .py files larger than this
  max_total_py_bytes: 6000000 # stop reading .py after this many bytes per package
  popular_top_n: 1000         # typosquat targets: the most downloaded packages
  workers: 2
  chunk: 500                  # rows written per checkpoint (run is resumable)
paths:
  labels: data/labels/labels_final.csv
  popular: data/raw/top-pypi-packages.csv
  features: data/features/features.csv
random_benign:
  n_request: 5000        # request extra; many names fail (too new, no sdist, too big)
  min_age_days: 180      # sampling filter only, never a model feature
  max_mb: 30
  workers: 16
  seed: 42
  out_dir: /content/benign_random
  datadog_compromised: /content/malicious-software-packages-dataset/samples/pypi/compromised_lib
  datadog_manifest: /content/malicious-software-packages-dataset/samples/pypi/manifest.json

train:
  seed: 42
  n_folds: 5
  holdout_size: 0.2            # group holdout, never used for tuning or thresholds
  group_cap: 20                # max training rows per split group (campaigns of identical packages)
  cross_benign_test_frac: 0.2  # protocol B: share of benign groups held out for testing
  models: [dummy_baseline, logistic_regression, random_forest, xgboost]
  search_iter: 20
  permutation_repeats: 5
  reports_dir: reports
  models_dir: models
  final:                       # features dropped from the shipped model (ablations decide)
    drop_prefixes: []
    drop_cols: []
  defaults:
    logistic_regression: {C: 1.0}
    random_forest: {n_estimators: 300, min_samples_leaf: 2, max_features: sqrt}
    xgboost: {n_estimators: 300, max_depth: 6, learning_rate: 0.1, subsample: 0.85, colsample_bytree: 0.8}
  search:
    random_forest:
      n_estimators: [200, 300, 500]
      max_depth: [null, 12, 20, 30]
      min_samples_leaf: [1, 2, 5]
      max_features: [sqrt, 0.3, 0.5]
    xgboost:
      n_estimators: [200, 400, 600]
      max_depth: [3, 4, 6, 8]
      learning_rate: [0.03, 0.05, 0.1]
      subsample: [0.7, 0.85, 1.0]
      colsample_bytree: [0.6, 0.8, 1.0]
      min_child_weight: [1, 3, 5]
  policies:                    # block_fpr targets from the brief; warn_fpr targets are our choice
    lenient:  {block_fpr: 0.005, warn_fpr: 0.03}
    balanced: {block_fpr: 0.01,  warn_fpr: 0.05}
    strict:   {block_fpr: 0.03,  warn_fpr: 0.10}
  mlflow:
    experiment: suspackage-training
    tracking_uri: https://dagshub.com/haris-fayyaz/suspackage-cli-interceptor.mlflow
